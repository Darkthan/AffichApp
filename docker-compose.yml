version: "3.8"
services:
  app:
    build: .
    # l'image doit préparer /app/data pour l'user
    user: "1000:1000"
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - NODE_ENV=production
      - JWT_SECRET=change-me-in-prod
      - ADMIN_DEFAULT_EMAIL=admin@example.com
      - ADMIN_DEFAULT_PASSWORD=admin123
      - APP_BASE_URL=${APP_BASE_URL:-}
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-}
      - SMTP_SECURE=${SMTP_SECURE:-}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASS=${SMTP_PASS:-}
      - MAIL_FROM=${MAIL_FROM:-}
      - SETTINGS_ENCRYPTION_KEY=${SETTINGS_ENCRYPTION_KEY:-}
    volumes:
      - app_data:/app/data
    restart: unless-stopped

volumes:
  app_data:
